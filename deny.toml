# cargo-deny configuration for v2
# https://embarkstudios.github.io/cargo-deny/

# Version 2 format - removed deprecated keys (vulnerability, notice, unlicensed)
# See: https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# The database path
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only error on unmaintained crates that are direct dependencies
# Transitive dependencies from external crates are allowed
unmaintained = "workspace"
# Fail when an ignored advisory no longer matches anything, so an ignore is
# removed as soon as the upgrade it waits for lands instead of lingering.
unused-ignored-advisory = "deny"
# Ignore specific advisories (add as needed)
ignore = [
    # crypto-bigint 0.5.5 timing side channels in constant-time operations.
    # Pulled in only by k256/elliptic-curve 0.13 via alloy, which every alloy
    # release still requires (k256 ^0.13); the fix is crypto-bigint >=0.7.6,
    # used by k256/elliptic-curve 0.14. Exposure is limited to local-key
    # signing in ethcli. Tracked upstream in alloy-rs/alloy#4445. Once a
    # Dependabot alloy bump moves to k256 0.14, this ignore stops matching and
    # cargo deny fails: delete it in that PR.
    "RUSTSEC-2026-0387",
]

[licenses]
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BlueOak-1.0.0",  # permissive, OSI-approved (minicbor, via evmole)
    "Unicode-3.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",  # Used by webpki-roots for root certificate data
]
# The confidence threshold for detecting a license from license text
confidence-threshold = 0.8
# Allow private crates to be unlicensed
private = { ignore = true }

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for crates that have been marked as wildcards
wildcards = "deny"
# Path dependencies between workspace crates are fine
allow-wildcard-paths = true
# The graph highlighting used when creating dot graphs
highlight = "all"
# Crates to deny
deny = []
# Crates to skip when checking for duplicates
skip = []

[sources]
# Lint level for crates from unknown registries
unknown-registry = "deny"
# Lint level for crates from git repositories
unknown-git = "deny"
# List of allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
