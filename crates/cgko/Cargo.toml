[package]
name = "cgko"
version = "0.3.1"
edition = "2021"
description = "Unofficial Rust client for the CoinGecko API (cgko)"
license = "MIT"
repository = "https://github.com/yldfi/yldfi-rs"
homepage = "https://github.com/yldfi/yldfi-rs/tree/main/crates/cgko"
keywords = ["crypto", "coingecko", "api", "prices", "defi"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
readme = "README.md"
# Spec test fixtures are large and only used by this repo's tests
exclude = ["tests/spec_examples*"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
yldfi-common = { version = "0.1.7", path = "../yldfi-common" }

[dev-dependencies]
yldfi-spec-test = { path = "../spec-test" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
