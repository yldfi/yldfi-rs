[package]
name = "ethcli"
version = "0.30.15"
edition = "2021"
rust-version = "1.95"
description = "Comprehensive Ethereum CLI for logs, transactions, accounts, and contracts"
license = "MIT"
repository = "https://github.com/yldfi/yldfi-rs"
homepage = "https://github.com/yldfi/yldfi-rs/tree/main/crates/ethcli"
keywords = ["ethereum", "cli", "etherscan", "blockchain", "web3"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"
# Mainnet bytecode fixtures for tests; not needed to build the crate
exclude = ["tests/fixtures/bytecode/"]

[[bin]]
name = "ethcli"
path = "src/main.rs"

[lib]
name = "ethcli"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Ethereum
alloy = { version = "2", features = [
    "providers",
    "rpc-types",
    "sol-types",
    "json-abi",
    "transports",
    "transport-http",
    "dyn-abi",
] }

# Etherscan API
foundry-block-explorers = "0.25"
alloy-chains = "0.2"
# The reqwest major foundry-block-explorers uses, so its client can share one
# connection pool and timeout (features come from foundry-block-explorers)
reqwest-explorers = { package = "reqwest", version = "0.13", default-features = false }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "json",
] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
# raw_value: --fields copies numbers through verbatim (only adds a type)
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.1"

# Output formats
csv = "1.3"
rusqlite = { version = "0.43", features = ["bundled"] }

# Progress & logging
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
futures = "0.3"
parking_lot = "0.13"
rand = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
hmac = "0.13"
dirs = "7"
regex = "1.11"
num-traits = "0.2"
sha2 = "0.11"
serde_urlencoded = "0.7"
secrecy = { workspace = true }
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }  # Dates and CEX timestamps

# API clients
alcmy = { version = "0.4.1", path = "../alcmy" }
cgko = { version = "0.3.1", path = "../cgko" }
dllma = { version = "0.3.2", path = "../dllma" }
mrls = { version = "0.3.5", path = "../mrls" }
dnapi = { version = "0.3.3", path = "../dnapi" }
crv = { version = "0.2.3", path = "../crv" }
pythc = { version = "0.2.3", path = "../pythc" }
tndrly = { version = "0.5.3", path = "../tndrly" }
yldfi-common = { version = "0.1.7", path = "../yldfi-common" }

# DEX aggregator clients
openoc = { version = "0.2.1", path = "../openoc" }
cowp = { version = "0.2.3", path = "../cowp" }
kybr = { version = "0.2.2", path = "../kybr" }
zrxswap = { version = "0.2.2", path = "../zrxswap" }
oinch = { version = "0.3.0", path = "../oinch" }
lfi = { version = "0.4.0", path = "../lfi" }
vlra = { version = "0.2.3", path = "../vlra" }
ensof = { version = "0.2.3", path = "../ensof" }

# Uniswap client (V2, V3, V4)
unswp = { version = "0.1.8", path = "../unswp" }
uniswap-v3-sdk = { version = "=7.0.0", features = ["extensions", "std"] }
uniswap-v4-sdk = { version = "=2.0.0", features = ["extensions", "std"] }

# Yearn Kong API client
ykong = { version = "0.1.7", path = "../ykong" }

# GoPlus Security API client
gplus = { version = "0.2.1", path = "../gplus" }

# Solodit vulnerability database client
sldt = { version = "0.2.1", path = "../sldt" }

# Bytecode analysis
evmole = { version = "0.10.1", features = ["serde"] }
evm-disassembler = "0.6"

# Chainlink Data Streams
chainlink-data-streams-report = "1.2"

# Centralised exchange market data
cexm = { version = "0.1.2", path = "../cexm" }
pamm = { version = "0.1.0", path = "../pamm" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

[lints]
workspace = true
