name: Publish Crate

# Publishes every workspace crate whose version isn't on crates.io yet, in
# dependency order, in ONE job. Release Please dispatches this once per release
# (see release-please.yml). It used to run once per release tag; then the
# dependents of a crate released alongside them could hold every runner slot
# waiting for it while its own job sat queued.
# ethcli itself is published by release.yml, which also builds its binaries.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Only this crate (e.g. pythc, yldfi-common). Empty = every unpublished crate.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to publish from (tag, branch, or SHA). Defaults to main.'
        required: false
        type: string
        default: 'main'

# Prevent concurrent publishes of the same crate
concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# P2-5: Explicit shell declaration for all bash scripts
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 90  # every crate in turn, e.g. after a yldfi-common release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Validate ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! git rev-parse --verify "$REF" >/dev/null 2>&1; then
            echo "::error::Invalid ref: $REF does not exist"
            exit 1
          fi
          echo "Ref valid: $REF ($(git rev-parse --short "$REF"))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish
          # cargo publish builds a fresh packaged copy under target/package,
          # so caching target/ only makes the post-step trip over it (ENOENT).
          cache-targets: "false"

      - name: Publish unpublished crates in dependency order
        env:
          ONLY: ${{ inputs.crate }}
          UA: yldfi-rs release workflow (https://github.com/yldfi/yldfi-rs)
        run: |
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::Invalid crate name: $ONLY"
            exit 1
          fi

          # "name version" for each publishable crate, dependencies first.
          # ethcli is left to release.yml.
          cargo metadata --no-deps --format-version 1 > /tmp/metadata.json
          python3 -I - /tmp/metadata.json > /tmp/order.txt <<'PY'
          import json, sys
          packages = {p["name"]: p for p in json.load(open(sys.argv[1]))["packages"]}
          order, seen = [], set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              for dep in packages[name]["dependencies"]:
                  if dep["name"] in packages and dep["kind"] in (None, "build"):
                      visit(dep["name"])
              order.append(name)
          for name in sorted(packages):
              visit(name)
          for name in order:
              if name != "ethcli" and packages[name]["publish"] != []:
                  print(name, packages[name]["version"])
          PY
          if [ -n "$ONLY" ] && ! grep -q "^$ONLY " /tmp/order.txt; then
            echo "::error::$ONLY is not a publishable workspace crate"
            exit 1
          fi

          # Trusted Publishing, one short-lived token per crate so a long run
          # never outlives its token; each is revoked once used.
          crates_io_token() {
            local jwt token
            jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r .value)
            echo "::add-mask::$jwt" >&2
            token=$(jq -n --arg jwt "$jwt" '{jwt: $jwt}' | curl -sSf -A "$UA" \
              -H "Content-Type: application/json" --data @- \
              https://crates.io/api/v1/trusted_publishing/tokens | jq -r .token)
            echo "::add-mask::$token" >&2
            if [ -z "$token" ] || [ "$token" = "null" ]; then
              echo "::error::crates.io did not issue a trusted publishing token" >&2
              return 1
            fi
            printf '%s' "$token"
          }
          revoke() {
            curl -sS -o /dev/null -A "$UA" -X DELETE -H "Authorization: Bearer $1" \
              https://crates.io/api/v1/trusted_publishing/tokens || true
          }

          missing_dep="failed to select a version for the requirement|no matching package named|candidate versions found which didn't match"
          published=0
          while read -r name version; do
            if [ -n "$ONLY" ] && [ "$name" != "$ONLY" ]; then
              continue
            fi
            # crates.io answers 403 to requests without a descriptive User-Agent
            if curl -sf -A "$UA" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
              echo "$name@$version is already on crates.io"
              continue
            fi
            echo "::group::Publish $name@$version"
            start=$SECONDS
            while true; do
              token=$(crates_io_token)
              if CARGO_REGISTRY_TOKEN="$token" cargo publish --locked --package "$name" > /tmp/publish.log 2>&1; then
                revoke "$token"
                cat /tmp/publish.log
                published=$((published + 1))
                break
              fi
              revoke "$token"
              cat /tmp/publish.log
              if grep -q "already exists" /tmp/publish.log; then
                echo "::warning::$name@$version already exists on crates.io, skipping"
                break
              fi
              # Dependencies are published first and cargo waits for each to
              # be indexed, so this only covers a slow index, or a single-crate
              # run whose dependency hasn't been published yet.
              waited=$((SECONDS - start))
              if grep -Eq "$missing_dep" /tmp/publish.log && [ "$waited" -lt 600 ]; then
                echo "::notice::$name: a dependency is not on crates.io yet (${waited}s); retrying in 30s"
                sleep 30
                continue
              fi
              echo "::endgroup::"
              echo "::error::Publishing $name@$version failed"
              exit 1
            done
            echo "::endgroup::"
          done < /tmp/order.txt
          echo "Published $published crate(s)"
