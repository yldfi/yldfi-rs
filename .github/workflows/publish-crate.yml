name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish (e.g., pyth, yldfi-common)'
        required: true
        type: string
      ref:
        description: 'Git ref to publish from (tag, branch, or SHA). Defaults to main.'
        required: false
        type: string
        default: 'main'
  push:
    tags:
      # Note: ethcli-v* handled by release.yml (includes binary builds)
      - 'alcmy-v*'
      - 'cgko-v*'
      - 'cowp-v*'
      - 'crv-v*'
      - 'dllma-v*'
      - 'dnapi-v*'
      - 'dnsim-v*'
      - 'ensof-v*'
      - 'ethcli-mcp-v*'
      - 'gplus-v*'
      - 'kybr-v*'
      - 'lfi-v*'
      - 'mrls-v*'
      - 'oinch-v*'
      - 'openoc-v*'
      - 'pythc-v*'
      - 'sldt-v*'
      - 'tndrly-v*'
      - 'unswp-v*'
      - 'vlra-v*'
      - 'ykong-v*'
      - 'yldfi-common-v*'
      - 'zrxswap-v*'

# Prevent concurrent publishes of the same crate
concurrency:
  group: publish-${{ inputs.crate || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# P2-5: Explicit shell declaration for all bash scripts
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # P1-3: Validate ref exists (for workflow_dispatch)
      - name: Validate ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! git rev-parse --verify "$REF" >/dev/null 2>&1; then
            echo "::error::Invalid ref: $REF does not exist"
            exit 1
          fi
          echo "Ref valid: $REF ($(git rev-parse --short "$REF"))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: publish

      # P0-2: Validate crate name and use safe output
      - name: Determine and validate crate name
        id: crate
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_CRATE: ${{ inputs.crate }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CRATE_NAME="$INPUT_CRATE"
          else
            # Extract crate name (everything before -v)
            CRATE_NAME="${TAG_NAME%-v*}"
          fi

          # P0-2: Validate crate name (alphanumeric, hyphens, underscores only)
          if ! [[ "$CRATE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::Invalid crate name: $CRATE_NAME (must be alphanumeric with hyphens/underscores)"
            exit 1
          fi

          # P0-1: Safe output using heredoc (prevents newline injection)
          {
            echo "name<<GITHUB_OUTPUT_EOF"
            printf '%s' "$CRATE_NAME"
            echo ""
            echo "GITHUB_OUTPUT_EOF"
          } >> $GITHUB_OUTPUT
          echo "Publishing crate: $CRATE_NAME"

      # P0-1: Safe output using heredoc
      - name: Check if version already published
        id: check
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version for $CRATE_NAME"
            exit 1
          fi
          # Safe output using heredoc
          {
            echo "version<<GITHUB_OUTPUT_EOF"
            printf '%s' "$VERSION"
            echo ""
            echo "GITHUB_OUTPUT_EOF"
          } >> $GITHUB_OUTPUT
          if curl -sf "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::$CRATE_NAME@$VERSION already exists on crates.io, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: |
          if ! cargo publish --locked --package "$CRATE_NAME" 2>&1 | tee /tmp/publish.log; then
            if grep -q "already exists" /tmp/publish.log; then
              echo "::warning::$CRATE_NAME@${{ steps.check.outputs.version }} already exists on crates.io, skipping"
            else
              cat /tmp/publish.log
              exit 1
            fi
          fi
