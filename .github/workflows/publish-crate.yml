name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish (e.g., pyth, yldfi-common)'
        required: true
        type: string
  push:
    tags:
      # Note: ethcli-v* handled by release.yml (includes binary builds)
      - 'alcmy-v*'
      - 'cgko-v*'
      - 'cowp-v*'
      - 'crv-v*'
      - 'dllma-v*'
      - 'dnapi-v*'
      - 'dnsim-v*'
      - 'ensof-v*'
      - 'ethcli-mcp-v*'
      - 'gplus-v*'
      - 'kybr-v*'
      - 'lfi-v*'
      - 'mrls-v*'
      - 'oinch-v*'
      - 'openoc-v*'
      - 'pythc-v*'
      - 'sldt-v*'
      - 'tndrly-v*'
      - 'unswp-v*'
      - 'vlra-v*'
      - 'ykong-v*'
      - 'yldfi-common-v*'
      - 'zrxswap-v*'

# Prevent concurrent publishes of the same crate
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Determine crate name
        id: crate
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_CRATE: ${{ inputs.crate }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CRATE_NAME="$INPUT_CRATE"
          else
            # Extract crate name (everything before -v)
            CRATE_NAME="${TAG_NAME%-v*}"
          fi
          echo "name=$CRATE_NAME" >> $GITHUB_OUTPUT
          echo "Publishing crate: $CRATE_NAME"

      - name: Check if version already published
        id: check
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if curl -sf "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::$CRATE_NAME@$VERSION already exists on crates.io, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: cargo publish --package "$CRATE_NAME"
