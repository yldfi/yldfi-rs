name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish (e.g., pyth, yldfi-common)'
        required: true
        type: string
      ref:
        description: 'Git ref to publish from (tag, branch, or SHA). Defaults to main.'
        required: false
        type: string
        default: 'main'
  push:
    tags:
      # Note: ethcli-v* handled by release.yml (includes binary builds)
      - 'alcmy-v*'
      - 'cgko-v*'
      - 'cowp-v*'
      - 'crv-v*'
      - 'dllma-v*'
      - 'dnapi-v*'
      - 'ensof-v*'
      - 'ethcli-mcp-v*'
      - 'gplus-v*'
      - 'kybr-v*'
      - 'lfi-v*'
      - 'mrls-v*'
      - 'oinch-v*'
      - 'openoc-v*'
      - 'pythc-v*'
      - 'sldt-v*'
      - 'tndrly-v*'
      - 'unswp-v*'
      - 'vlra-v*'
      - 'ykong-v*'
      - 'yldfi-common-v*'
      - 'zrxswap-v*'

# Prevent concurrent publishes of the same crate
concurrency:
  group: publish-${{ inputs.crate || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# P2-5: Explicit shell declaration for all bash scripts
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30  # covers the up-to-20-minute wait for dependencies to reach crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # P1-3: Validate ref exists (for workflow_dispatch)
      - name: Validate ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! git rev-parse --verify "$REF" >/dev/null 2>&1; then
            echo "::error::Invalid ref: $REF does not exist"
            exit 1
          fi
          echo "Ref valid: $REF ($(git rev-parse --short "$REF"))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: publish
          # cargo publish builds a fresh packaged copy under target/package,
          # so caching target/ only makes the post-step trip over it (ENOENT).
          cache-targets: "false"

      # P0-2: Validate crate name and use safe output
      - name: Determine and validate crate name
        id: crate
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_CRATE: ${{ inputs.crate }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CRATE_NAME="$INPUT_CRATE"
          else
            # Extract crate name (everything before -v)
            CRATE_NAME="${TAG_NAME%-v*}"
          fi

          # P0-2: Validate crate name (alphanumeric, hyphens, underscores only)
          if ! [[ "$CRATE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::Invalid crate name: $CRATE_NAME (must be alphanumeric with hyphens/underscores)"
            exit 1
          fi

          # P0-1: Safe output using heredoc (prevents newline injection)
          {
            echo "name<<GITHUB_OUTPUT_EOF"
            printf '%s' "$CRATE_NAME"
            echo ""
            echo "GITHUB_OUTPUT_EOF"
          } >> $GITHUB_OUTPUT
          echo "Publishing crate: $CRATE_NAME"

      # P0-1: Safe output using heredoc
      - name: Check if version already published
        id: check
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version for $CRATE_NAME"
            exit 1
          fi
          # Safe output using heredoc
          {
            echo "version<<GITHUB_OUTPUT_EOF"
            printf '%s' "$VERSION"
            echo ""
            echo "GITHUB_OUTPUT_EOF"
          } >> $GITHUB_OUTPUT
          if curl -sf "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::$CRATE_NAME@$VERSION already exists on crates.io, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Trusted Publishing: exchange the job's GitHub OIDC token for a
      # short-lived crates.io token (revoked automatically when the job ends).
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          CRATE_VERSION: ${{ steps.check.outputs.version }}
        run: |
          # Release Please bumps dependents to the exact new version of a crate
          # released alongside them, and every tag publishes in its own run, so a
          # dependent can get here before the version it needs is on crates.io.
          # Retry for up to 20 minutes while cargo says a dependency is missing.
          # (Inline rather than a script: manual runs may check out an older ref.)
          missing_dep="failed to select a version for the requirement|no matching package named|candidate versions found which didn't match"
          start=$SECONDS
          attempt=1
          while true; do
            if cargo publish --locked --package "$CRATE_NAME" > /tmp/publish.log 2>&1; then
              cat /tmp/publish.log
              break
            fi
            cat /tmp/publish.log
            if grep -q "already exists" /tmp/publish.log; then
              echo "::warning::$CRATE_NAME@$CRATE_VERSION already exists on crates.io, skipping"
              break
            fi
            waited=$((SECONDS - start))
            if grep -Eq "$missing_dep" /tmp/publish.log && [ "$waited" -lt 1200 ]; then
              echo "::notice::$CRATE_NAME: a workspace dependency is not on crates.io yet (attempt $attempt, ${waited}s elapsed); retrying in 60s"
              sleep 60
              attempt=$((attempt + 1))
              continue
            fi
            if grep -Eq "$missing_dep" /tmp/publish.log; then
              echo "::error::$CRATE_NAME: a workspace dependency was still missing from crates.io after ${waited}s; publish it first, then re-run this workflow"
            fi
            exit 1
          done
