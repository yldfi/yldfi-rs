name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks that don't need dependencies compiled
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Run fmt first (fastest)
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Then clippy (needs to compile, but cached)
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Security checks - can run in parallel with lint
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # Main build and test - depends on lint passing
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Share cache with lint job
          shared-key: ubuntu-stable

      # Check compiles first (faster feedback)
      - name: Check
        run: cargo check --workspace

      # Build ethcli for MCP tests
      - name: Build ethcli
        run: cargo build -p ethcli --release

      # Run all tests
      - name: Test
        run: cargo test --workspace
        env:
          ETHCLI_PATH: ${{ github.workspace }}/target/release/ethcli
