name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # P3-4: Weekly scheduled security audit to catch new CVEs
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6am UTC

# Cancel superseded PR runs; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Line tables keep file:line in panic backtraces but drop the rest of the
  # debug info: about half the target dir and a faster test build
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Fast checks that don't need dependencies compiled
  lint:
    name: Lint
    # The weekly schedule only runs the security checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: lint
          # PRs restore the main branch cache but don't save their own
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Run fmt first (fastest)
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Then clippy (needs to compile, but cached)
      # P2-1: Add --locked for reproducibility
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  # Security checks - can run in parallel with lint
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny checks RustSec advisories as well as licenses, bans and
      # sources; advisory ignores live in deny.toml
      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Release PRs only: check each library crate whose version the PR bumps
  # (except ethcli, see below) against its last release on crates.io. A public API break needs a bigger bump than
  # release-please chose (a commit that wasn't marked `!`) and fails here; fix
  # it with a `release-as` or a `fix(crate)!:` commit.
  semver:
    name: Semver
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Crates this release bumps
        id: bumped
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          base = os.environ["BASE"]
          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          # ethcli's library is the CLI's own plumbing (its clap command enums
          # are public, so every new flag reads as a break) and has no library
          # users; check it again if that changes
          skip = {"ethcli"}
          bumped = []
          for pkg in meta["packages"]:
              # Only library crates have a public API to check (not ethcli-mcp)
              if pkg["name"] in skip or not any("lib" in t["kind"] for t in pkg["targets"]):
                  continue
              manifest = os.path.relpath(pkg["manifest_path"])
              diff = subprocess.run(["git", "diff", f"{base}...HEAD", "--", manifest],
                                    capture_output=True, text=True).stdout
              if re.search(r'^\+version\s*=', diff, re.M):
                  bumped.append(pkg["name"])
          print("packages=" + ",".join(sorted(bumped)))
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        if: steps.bumped.outputs.packages != ''
        with:
          package: ${{ steps.bumped.outputs.packages }}

  # Main build and test - runs in parallel with lint (P2-4)
  test:
    name: Test
    # P2-4: Removed 'needs: lint' for parallel execution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Build ethcli for MCP tests (debug, so it shares artifacts with cargo test)
      - name: Build ethcli
        run: cargo build -p ethcli --locked

      # Run all tests
      # P2-1: Add --locked for reproducibility
      - name: Test
        run: cargo test --workspace --locked
        env:
          ETHCLI_PATH: ${{ github.workspace }}/target/debug/ethcli
