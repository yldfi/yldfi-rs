name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # P3-4: Weekly scheduled security audit to catch new CVEs
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6am UTC

# Cancel superseded PR runs; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks that don't need dependencies compiled
  lint:
    name: Lint
    # The weekly schedule only runs the security checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: lint
          # PRs restore the main branch cache but don't save their own
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Run fmt first (fastest)
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Then clippy (needs to compile, but cached)
      # P2-1: Add --locked for reproducibility
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  # Security checks - can run in parallel with lint
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: security
          # Nothing is compiled here; only cache the registry and installed tools
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Security audit
        run: cargo audit

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Main build and test - runs in parallel with lint (P2-4)
  test:
    name: Test
    # P2-4: Removed 'needs: lint' for parallel execution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Build ethcli for MCP tests (debug, so it shares artifacts with cargo test)
      - name: Build ethcli
        run: cargo build -p ethcli --locked

      # Run all tests
      # P2-1: Add --locked for reproducibility
      - name: Test
        run: cargo test --workspace --locked
        env:
          ETHCLI_PATH: ${{ github.workspace }}/target/debug/ethcli
