name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P1-1: Environment protection (optional - remove if approval not desired for PRs)
    # environment: production
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          # P3-3: Using GH_PAT is required to trigger other workflows on tag push
          # Ensure this PAT has minimal scopes: contents:write, pull-requests:write
          # Consider using a GitHub App token for better security and auditability
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Note: When a release is created, release-please pushes a tag
      # which triggers release.yml (for ethcli) or publish-crate.yml (for other crates)
